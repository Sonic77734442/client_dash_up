name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: client_dash_test
          POSTGRES_PASSWORD: client_dash_test_password
          POSTGRES_DB: client_dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U client_dash_test -d client_dash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Audit backend dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Check backend dependency consistency
        run: python -m pip check

      - name: Migration sanity check
        run: python scripts/check_migrations.py

      - name: SQLite schema init check
        run: python -c "from app.db import init_sqlite; init_sqlite('/tmp/ci-budgets.db')"

      - name: PostgreSQL fresh migration and idempotency check
        env:
          DATABASE_URL: postgresql://client_dash_test:client_dash_test_password@127.0.0.1:5432/client_dash_test
        run: |
          python scripts/migrate_postgres.py
          python scripts/migrate_postgres.py

      - name: Run backend tests
        env:
          APP_ENV: test
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql://client_dash_test:client_dash_test_password@127.0.0.1:5432/client_dash_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        run: npm ci

      - name: Install smoke backend deps
        run: python -m pip install -r ../requirements.txt

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        env:
          PYTHON_BIN: python
        run: npm run test:smoke
